# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: Eng1999/rawabi-medical
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b87e4a98-c903-4503-ae2a-08596923fbb8/pkce
  auth_token_endpoint: /sites/b87e4a98-c903-4503-ae2a-08596923fbb8/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://rwabimed.com

publish_mode: simple
media_folder: "assets/news"
public_folder: "/assets/news"

collections:
  - name: "news"
    label: "الأخبار"
    folder: "content/news"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "العنوان (عربي)", name: "title", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "التاريخ", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "الصورة", name: "image", widget: "image" }
      - { label: "المقتطف (عربي)", name: "excerpt", widget: "text" }
      - { label: "Excerpt (English)", name: "excerpt_en", widget: "text" }
      - { label: "المحتوى (عربي)", name: "body", widget: "markdown" }
